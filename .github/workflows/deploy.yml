name: Deploy Power BI / Fabric Semantic Model

# Sadece main dalına (branch) bir push yapıldığında çalışsın
on:
  push:
    branches:
      - main
  workflow_dispatch: # İstediğinizde GitHub arayüzünden elle de tetikleyebilmeniz için

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje kodlarını GitHub sunucusuna çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python ortamını kur
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Gerekli kütüphaneleri yükle
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Fabric Authentication & Deploy Script'ini Çalıştır
      - name: Run Deploy Script
        env:
          FABRIC_WORKSPACE: ${{ secrets.FABRIC_WORKSPACE }}
          FABRIC_FOLDER: ${{ secrets.FABRIC_FOLDER }}
        run: |
          python deploy.py --workspace "$FABRIC_WORKSPACE" --folder "$FABRIC_FOLDER"